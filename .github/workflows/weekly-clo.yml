name: Weekly CLO

on:
  schedule:
    - cron: "0 4 * * 3" # Tuesday 10pm Denver in daylight time (MDT). After Nov 1 clocks fall back and this reads 9pm MST. Flip to "0 5 * * 3" that week to hold 10pm, or accept the drift.
  workflow_dispatch:

concurrency:
  group: weekly-clo
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set git identity
        run: |
          git config user.name "clo-substack-bot"
          git config user.email "clo-substack-bot@users.noreply.github.com"

      - name: Get run date
        id: rundate
        run: echo "today=$(date +%F)" >> "$GITHUB_OUTPUT"

      - name: Install image renderer
        run: pip install --quiet Pillow

      - name: Run OpenCode CLO team (tier 1)
        id: tier1
        continue-on-error: true
        timeout-minutes: 9
        uses: anomalyco/opencode/github@latest
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: google/gemini-3.7-flash
          use_github_token: true
          prompt: |
            You run on google/gemini-3.7-flash. Record exactly that string in meta.json model_text.
            Solo run in this repo, ONE session, never delegate, Task tool is disabled.
            Date for this run: ${{ steps.rundate.outputs.today }}. Use folder drafts/${{ steps.rundate.outputs.today }}.
            Follow prompts/orchestrate-clo.md exactly, all phases inline: research, article, 5 comic buyer notes, visual set with rotation plus brand lock, ONE rotating deep track by ISO week mod 4 (0 platform brief, 1 dm-pack, 2 image-prompt-lab, 3 article-prompt-lab), gate plus meta.
            Output is 9 core files plus meta.json plus 1 rotation file: article-draft.md, note-1.md through note-5.md, cover.svg, cover.png, image-prompt-pack.md, video-script-pack.md, research-brief.md, and the rotation file for this week.
            Brand lock v1 in prompts/brand-clo.md: Ink Black #0B0B10, Signal Yellow #FFD21F hero, Hazard Magenta #FF2E7E villain only, Paper White #F5F1E6. Locked overlay appended verbatim to every visual prompt.
            Video prompts target fal.ai image to video (Kling 3 Pro or Seedance 2.0 primary, 15s, 9:16, native audio on). Prompt packs only, never generate, never spend.
            DMs are drafts only, never send. Recommendations only, never edit .opencode, skills, prompts, opencode.json, or workflow files.
            If the text model returns overload or high demand errors: sleep 120 once, retry once, then stop and save partial files with meta.json status "partial-overload". Never burn the run into timeout.
            Never push secrets. Work on the checked-out files; do not push directly. Partial files beat no files.

      - name: Run OpenCode CLO team (tier 2)
        id: tier2
        if: steps.tier1.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 9
        uses: anomalyco/opencode/github@latest
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: google/gemini-3.5-flash-lite
          use_github_token: true
          prompt: |
            You run on google/gemini-3.5-flash-lite (tier 2, tier 1 was overloaded). Record exactly that string in meta.json model_text.
            The tier 1 run may have left partial files in drafts/${{ steps.rundate.outputs.today }}. Resume from them: keep finished files, complete the missing phases.
            Solo run in this repo, ONE session, never delegate, Task tool is disabled.
            Date for this run: ${{ steps.rundate.outputs.today }}. Use folder drafts/${{ steps.rundate.outputs.today }}.
            Follow prompts/orchestrate-clo.md exactly, all phases inline: research, article, 5 comic buyer notes, visual set with rotation plus brand lock, ONE rotating deep track by ISO week mod 4 (0 platform brief, 1 dm-pack, 2 image-prompt-lab, 3 article-prompt-lab), gate plus meta.
            Output is 9 core files plus meta.json plus 1 rotation file: article-draft.md, note-1.md through note-5.md, cover.svg, cover.png, image-prompt-pack.md, video-script-pack.md, research-brief.md, and the rotation file for this week.
            Brand lock v1 in prompts/brand-clo.md: Ink Black #0B0B10, Signal Yellow #FFD21F hero, Hazard Magenta #FF2E7E villain only, Paper White #F5F1E6. Locked overlay appended verbatim to every visual prompt.
            Video prompts target fal.ai image to video (Kling 3 Pro or Seedance 2.0 primary, 15s, 9:16, native audio on). Prompt packs only, never generate, never spend.
            DMs are drafts only, never send. Recommendations only, never edit .opencode, skills, prompts, opencode.json, or workflow files.
            If the text model returns overload or high demand errors: sleep 120 once, retry once, then stop and save partial files with meta.json status "partial-overload". Never burn the run into timeout.
            Never push secrets. Work on the checked-out files; do not push directly. Partial files beat no files.

      - name: Run OpenCode CLO team (tier 3)
        id: tier3
        if: steps.tier1.outcome == 'failure' && steps.tier2.outcome != 'success'
        continue-on-error: true
        timeout-minutes: 9
        uses: anomalyco/opencode/github@latest
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: google/gemini-3.1-flash-lite
          use_github_token: true
          prompt: |
            You run on google/gemini-3.1-flash-lite (tier 3, tiers 1 and 2 were overloaded). Record exactly that string in meta.json model_text.
            Earlier tiers may have left partial files in drafts/${{ steps.rundate.outputs.today }}. Resume from them: keep finished files, complete the missing phases.
            Solo run in this repo, ONE session, never delegate, Task tool is disabled.
            Date for this run: ${{ steps.rundate.outputs.today }}. Use folder drafts/${{ steps.rundate.outputs.today }}.
            Follow prompts/orchestrate-clo.md exactly, all phases inline: research, article, 5 comic buyer notes, visual set with rotation plus brand lock, ONE rotating deep track by ISO week mod 4 (0 platform brief, 1 dm-pack, 2 image-prompt-lab, 3 article-prompt-lab), gate plus meta.
            Output is 9 core files plus meta.json plus 1 rotation file: article-draft.md, note-1.md through note-5.md, cover.svg, cover.png, image-prompt-pack.md, video-script-pack.md, research-brief.md, and the rotation file for this week.
            Brand lock v1 in prompts/brand-clo.md: Ink Black #0B0B10, Signal Yellow #FFD21F hero, Hazard Magenta #FF2E7E villain only, Paper White #F5F1E6. Locked overlay appended verbatim to every visual prompt.
            Video prompts target fal.ai image to video (Kling 3 Pro or Seedance 2.0 primary, 15s, 9:16, native audio on). Prompt packs only, never generate, never spend.
            DMs are drafts only, never send. Recommendations only, never edit .opencode, skills, prompts, opencode.json, or workflow files.
            If the text model returns overload or high demand errors: sleep 120 once, retry once, then stop and save partial files with meta.json status "partial-overload". Never burn the run into timeout.
            Never push secrets. Work on the checked-out files; do not push directly. Partial files beat no files.

      # Note: no separate PR step. The opencode CLI pushes branch
      # opencode/dispatch-* and opens the review PR itself on every run.

      - name: Save partial work (never lose a run)
        if: always()
        run: |
          TODAY=$(date +%F)
          if [ -d "drafts/$TODAY" ] && [ -n "$(ls -A drafts/$TODAY 2>/dev/null)" ]; then
            git checkout -B "clo/partial-$TODAY"
            git add -A -- "drafts/$TODAY"
            git commit -m "Partial CLO drafts for $TODAY (tiers: ${{ steps.tier1.outcome }}/${{ steps.tier2.outcome }}/${{ steps.tier3.outcome }})" || echo "nothing to commit"
            git push -f origin "clo/partial-$TODAY"
            echo "partial work saved to clo/partial-$TODAY"
          else
            echo "no drafts written, nothing to save"
          fi
